<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>SOLVIA｜装飾の動作確認</title><link rel="stylesheet" href="world.css"><style>*{box-sizing:border-box}html,body{margin:0;background:#092337;color:#edf6ef;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1100px;margin:auto}header{height:38px;padding:8px 14px;background:#124333;display:flex;justify-content:space-between;align-items:center}header small{font-size:12px;color:#c6dfd4}.hq-scene{position:relative;width:100%;aspect-ratio:2;overflow:hidden;background:#254638}.hq-art{display:block;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}footer{height:60px;display:flex;align-items:center;padding:8px 14px;gap:20px;font-size:14px}.state{color:#a3f0c9}.note{margin-left:auto;color:#becfd8;font-size:12px}.world-toggle{font-size:12px}</style><main><header><strong>SOLVIA｜装飾の動作確認</strong><small>固定俯瞰・確認用拡大表示</small></header><section class="hq-scene" aria-label="動作確認の情景"><img class="hq-art" src="art/headquarters-yard.webp" alt="装飾の本部"></section><footer><span>1人目：<b class="state">待機</b></span><span class="note">演出です。実際の位置・設備状態・点検実施を示しません。</span></footer></main><script type="module">import {worldMarkup,mountWorld,initWorld} from './world.js';const root=document.querySelector('.hq-scene');root.insertAdjacentHTML('beforeend',worldMarkup().replaceAll('src="art/','src="art/'));initWorld();mountWorld(root);const labels={idle:'停止・待機',walk:'通路を歩行',check:'計器を確認',crouch:'しゃがんで確認'};new MutationObserver(()=>{const actor=root.querySelector('[data-actor="worker-walk"]');if(actor)document.querySelector('.state').textContent=labels[actor.dataset.state]||'待機';}).observe(root,{subtree:true,attributes:true,attributeFilter:['data-state']});</script></html>
